[package]
name = "octos-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Self-contained persistence/state stores for octos (extracted from octos-cli)"

[dependencies]
octos-core = { workspace = true }
chrono = { workspace = true }
eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
redb = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
# Secure token generation/comparison in `admin_token_store` (version-pinned in
# octos-cli, not workspace deps).
getrandom = "0.2"
constant_time_eq = "0.3"
# c2: PostgreSQL backend for the repository contract (feature-gated so the
# single-node local adapter build carries no PG dependency).
sqlx = { workspace = true, optional = true }

[features]
# Exposes test-only helpers (e.g. `approvals_audit::read_audit_lines`) to
# downstream crates' test builds. Never enable in production.
test-util = []
# PostgreSQL repository backend (`repository::postgres`).
postgres = ["dep:sqlx"]

[dev-dependencies]
tempfile = { workspace = true }
# The real-PG integration suite manages per-test schemas directly.
sqlx = { workspace = true, features = ["postgres"] }

[lints]
workspace = true
