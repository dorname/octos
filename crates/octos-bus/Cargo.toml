[package]
name = "octos-bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Message bus, channels, and session management for octos gateway"

[features]
default = []
api = ["axum"]
telegram = ["teloxide"]
discord = ["serenity"]
whatsapp = ["tokio-tungstenite"]
feishu = ["tokio-tungstenite", "axum", "rustls", "rustls-native-certs"]
twilio = ["axum"]
wecom = ["axum"]
matrix = ["axum"]
wecom-bot = ["tokio-tungstenite", "rustls", "rustls-native-certs"]

[dependencies]
octos-core = { workspace = true }
octos-store = { workspace = true }
tokio = { workspace = true }
lru = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
uuid = { workspace = true }
cron = { workspace = true }
eyre = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
serde_yml = { workspace = true }
subtle = { workspace = true }
sha2 = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
base64 = { workspace = true }

# Optional: channel integrations
teloxide = { workspace = true, optional = true }
serenity = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

# Optional: channel TLS (feishu / wecom-bot)
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
axum = { workspace = true }
tokio-test = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
proptest = { workspace = true }
tracing-subscriber = { workspace = true }
octos-store = { workspace = true, features = ["postgres"] }
sqlx = { workspace = true, features = ["postgres"] }
