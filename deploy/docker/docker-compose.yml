version: "3.8"

services:
  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: octos
      POSTGRES_DB: octos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d octos"]
      interval: 5s
      timeout: 5s
      retries: 5

  octos:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:octos@pg:5432/octos
      RUST_LOG: info
    ports:
      - "8080:8080"
    depends_on:
      pg:
        condition: service_healthy
    command: ["serve", "--port", "8080"]

volumes:
  pgdata: