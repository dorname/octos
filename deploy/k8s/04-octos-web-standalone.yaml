# octos-web standalone (front/back separated) — k8s manifest.
# Blackboard #10: backend (svc/octos:8080) and web are independent;
# the embedded /app/ path is deprecated (503 expected). This manifest
# hosts the octos-web static dist behind nginx with /api + WS reverse
# proxy to svc/octos:8080 so the browser sees a single origin
# (no OCTOS_APPUI_ALLOWED_ORIGINS dependency).
#
# dist injection: dist (~102MB, tar.gz ~30MB) exceeds the 1MB ConfigMap
# limit and no local docker build daemon is available, so we reuse the
# same host-HTTP + init-wget pattern as the octos binary (#2436): an
# init container fetches octos-web-dist.tar.gz from
# http://host.docker.internal:18088 and untars into an emptyDir shared
# with the nginx container. Pod recreate requires the host HTTP to be
# up (same boundary as the octos binary; see K8S_DEPLOY_PROVEN.md).

apiVersion: v1
kind: ConfigMap
metadata:
  name: octos-web-nginx
  namespace: octos
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      # SPA fallback: any non-/api path serves index.html (client routing).
      location / {
        try_files $uri $uri/ /index.html;
      }

      # Reverse proxy all API traffic to the backend service.
      location /api/ {
        proxy_pass http://octos.octos.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WS upgrade (UI Protocol /api/ui-protocol/ws).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Long-lived WS / SSE-ish reads.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: octos-web
  namespace: octos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: octos-web
  template:
    metadata:
      labels:
        app: octos-web
    spec:
      initContainers:
      - name: inject-dist
        image: alpine:3.21
        command:
        - sh
        - -c
        - |
          set -e
          echo "Fetching octos-web dist from http://host.docker.internal:18088/octos-web-dist.tar.gz ..."
          if wget -q -O /tmp/octos-web-dist.tar.gz http://host.docker.internal:18088/octos-web-dist.tar.gz; then
            mkdir -p /webroot
            tar -xzf /tmp/octos-web-dist.tar.gz -C /webroot
            echo "dist injected: $(ls /webroot/index.html && du -sh /webroot | cut -f1)"
          else
            echo "ERROR: failed to fetch octos-web-dist.tar.gz from host.docker.internal:18088."
            echo "On the host, run: cd <dir-of-tarball> && python3 -m http.server 18088 --bind 0.0.0.0 &"
            exit 1
          fi
        volumeMounts:
        - name: webroot
          mountPath: /webroot
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: webroot
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          readOnly: true
          subPath: default.conf
      volumes:
      - name: webroot
        emptyDir: {}
      - name: nginx-conf
        configMap:
          name: octos-web-nginx
          defaultMode: 0o644

---
apiVersion: v1
kind: Service
metadata:
  name: octos-web
  namespace: octos
spec:
  selector:
    app: octos-web
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
