apiVersion: v1
kind: Namespace
metadata:
  name: octos

---
# PersistentVolumeClaims: PG data + octos instance data + workspace.
# Pod 重建后数据保留——这是修复 K8s bug 2 的关键。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  namespace: octos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: octos-data
  namespace: octos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace
  namespace: octos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi

---
# PostgreSQL for cluster mode
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg
  namespace: octos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg
  template:
    metadata:
      labels:
        app: pg
    spec:
      containers:
      - name: pg
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: octos
        - name: POSTGRES_DB
          value: octos
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "octos"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: pgdata

---
apiVersion: v1
kind: Service
metadata:
  name: pg
  namespace: octos
spec:
  selector:
    app: pg
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP

---
# Non-sensitive config (DB URL, profile defaults, workspace path)
apiVersion: v1
kind: ConfigMap
metadata:
  name: octos-config
  namespace: octos
data:
  # === Required ===
  DATABASE_URL: "postgres://postgres:octos@pg.octos.svc.cluster.local:5432/octos"
  OCTOS_AUTH_TOKEN: "test-cluster-token-12345"

  # === Profile defaults (applied by init-config.sh) ===
  DEFAULT_PROFILE: "cluster-worker"
  WORKSPACE_DIR: "/workspace"

  # === LLM (provider-agnostic) ===
  # Set LLM_API_KEY_ENV to the name of the env var holding the key.
  # The actual key lives in Secret `llm-credentials`.
  LLM_PROVIDER: "anthropic"
  LLM_MODEL: "k3"
  LLM_BASE_URL: "https://api.kimi.com/coding/"
  LLM_API_KEY_ENV: "ANTHROPIC_API_KEY"

  # === Logging ===
  RUST_LOG: "info,sqlx=warn"

---
# Sensitive: API keys, must be created via:
#   kubectl create secret generic llm-credentials \
#     --from-literal=ANTHROPIC_API_KEY=<your-real-key> \
#     -n octos
#
# PLACEHOLDER GUARD: the literal REPLACE_ME below only exists so a fresh
# `kubectl apply` does not fail with "not found". A secret left at the
# placeholder lets serve boot healthy but EVERY LLM call returns 401
# (invalid_authentication_error) -- see K8S_DEPLOY_PROVEN.md "LLM API Key"
# section. deploy/scripts/deploy-k8s.sh (cluster variant) refuses to
# deploy while the live secret still holds the placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: llm-credentials
  namespace: octos
type: Opaque
stringData:
  # Placeholder -- MUST be replaced with a real key before first use.
  ANTHROPIC_API_KEY: "REPLACE_ME"

---
# init-config.sh: runs as initContainer BEFORE octos serve starts.
# Builds config.json + default profile, runs PG migrations.
apiVersion: v1
kind: ConfigMap
metadata:
  name: octos-init-script
  namespace: octos
data:
  init-config.sh: |
    #!/bin/sh
    set -e
    echo "=== octos k8s init ==="

    # 1. Data dir + profile roots (inbox avoids steer-sweep WARN spam — #2437)
    mkdir -p /tmp/octos-data/profiles
    chmod 700 /tmp/octos-data
    PROFILE_ID="${DEFAULT_PROFILE:-cluster-worker}"
    mkdir -p "/tmp/octos-data/profiles/${PROFILE_ID}/data/inbox"
    # Existing PVC profiles (e.g. admin) also need inbox before gateway starts.
    for d in /tmp/octos-data/profiles/*/data; do
      [ -d "$d" ] && mkdir -p "$d/inbox"
    done

    # 2. Top-level config (auth_token from env)
    cat > /tmp/octos-data/config.json <<EOF
    {
      "version": 1,
      "auth_token": "${OCTOS_AUTH_TOKEN}",
      "default_profile": "${DEFAULT_PROFILE:-cluster-worker}"
    }
    EOF

    # 3. Default profile (if absent)
    #    octos ProfileDefinition::load reads <data_dir>/profiles/<id>.json
    #    (flat file, NOT <id>/config.json subdir). Use flat format here.
    PROFILE_FILE=/tmp/octos-data/profiles/${PROFILE_ID}.json
    NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
    if [ ! -f "$PROFILE_FILE" ]; then
      cat > "$PROFILE_FILE" <<EOF
    {
      "id": "${PROFILE_ID}",
      "name": "Cluster Worker",
      "enabled": true,
      "workspace_root": "${WORKSPACE_DIR:-/workspace}",
      "config": {
        "llm": {
          "primary": {
            "provider": "${LLM_PROVIDER:-anthropic}",
            "api_type": "${LLM_PROVIDER:-anthropic}",
            "model": "${LLM_MODEL:-k3}",
            "base_url": "${LLM_BASE_URL:-}",
            "api_key_env": "${LLM_API_KEY_ENV:-ANTHROPIC_API_KEY}"
          }
        }
      },
      "created_at": "$NOW",
      "updated_at": "$NOW"
    }
    EOF
    fi

    # 4. Workspace dir
    mkdir -p "${WORKSPACE_DIR:-/workspace}"

    # 5. Fetch octos binary from host.docker.internal:8088.
    #    The user runs `python3 -m http.server 8088` (or similar) in
    #    the directory containing `octos` BEFORE applying this manifest.
    #    docker-desktop makes the host reachable at host.docker.internal.
    #    For Linux/minikube: replace with the host IP.
    echo "Fetching octos binary from http://host.docker.internal:8088/octos..."
    if wget -q -O /opt/octos/octos http://host.docker.internal:8088/octos; then
      chmod +x /opt/octos/octos
      echo "Binary installed: $(/opt/octos/octos --version 2>&1 | head -1)"
    else
      echo "ERROR: failed to fetch binary from host.docker.internal:8088."
      echo "On the host, run: cd <dir-of-octos-binary> && python3 -m http.server 8088 &"
      exit 1
    fi

    # 6. PG migrations (cluster mode).
    #    Require a binary built with `--features postgres` (#2436). When
    #    DATABASE_URL is set, `serve` attaches PgStore at startup and
    #    `store.migrate()` runs immediately in attach_durable_approvals_pg /
    #    attach_cron_service_pg. Without the feature the env is ignored and
    #    `\dt` stays empty.
    if [ -n "$DATABASE_URL" ]; then
      echo "DATABASE_URL set — serve will migrate PG at attach (needs --features postgres)."
    fi

    echo "=== init complete ==="

---
# Octos serve (cluster mode) with initContainer that runs the init script.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: octos
  namespace: octos
spec:
  replicas: 1
  # Recreate, NOT the default RollingUpdate: with replicas=1 + a
  # ReadWriteOnce PVC at /tmp/octos-data + octos's data-dir lockfile, a
  # rolling update's maxSurge starts the new pod BEFORE the old one
  # terminates; the new pod dies on OCTOS_DATA_DIR_LOCKED and the rollout
  # wedges forever (old pod keeps serving a stale binary). Recreate fully
  # terminates the old pod — releasing the lockfile and the RWO mount —
  # before starting the new one. Brief downtime is acceptable for
  # single-node local deploys.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: octos
  template:
    metadata:
      labels:
        app: octos
    spec:
      # initContainer: prepares config + injects binary via emptyDir.
      # This avoids the hostPath brittleness (docker-desktop VM cannot
      # see WSL's /tmp; Windows-only paths also don't work uniformly).
      # The binary is base64-encoded in ConfigMap `octos-binary` and
      # decoded into an emptyDir shared with the main container.
      initContainers:
      - name: init
        image: alpine:3.21
        command: ["/usr/local/bin/init-config.sh"]
        envFrom:
        - configMapRef:
            name: octos-config
        - secretRef:
            name: llm-credentials
        volumeMounts:
        - name: octos-data
          mountPath: /tmp/octos-data
        - name: workspace
          mountPath: /workspace
        - name: octos-binary
          mountPath: /opt/octos
        - name: init-script
          mountPath: /usr/local/bin/init-config.sh
          readOnly: true
          subPath: init-config.sh
        - name: cluster-worker-profile
          mountPath: /tmp/octos-data/profiles/cluster-worker.json
          readOnly: true
          subPath: cluster-worker.json
      containers:
      - name: octos
        image: alpine:3.21
        imagePullPolicy: IfNotPresent
        command: ["/opt/octos/octos"]
        args:
        - serve
        - --port
        - "8080"
        - --host
        - "0.0.0.0"
        - --instance-data-dir
        - /tmp/octos-data
        envFrom:
        - configMapRef:
            name: octos-config
        - secretRef:
            name: llm-credentials
        - secretRef:
            name: minimax-credentials
        env:
        - name: OCTOS_HOME
          value: /tmp/octos-data
        - name: RUST_LOG
          value: "info,octos_cli=debug,octos_store=debug"
        # Allow AppUI/WebSocket from common port-forward origins.
        # Serve auto-appends loopback for the *container* bind port (8080)
        # only — PF ports (9091, 50080) must be listed explicitly.
        - name: OCTOS_APPUI_ALLOWED_ORIGINS
          value: "http://localhost:9091,http://127.0.0.1:9091,http://localhost:8080,http://127.0.0.1:8080,http://localhost:50080,http://127.0.0.1:50080"
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: octos-data
          mountPath: /tmp/octos-data
        - name: workspace
          mountPath: /workspace
        - name: cluster-worker-profile
          mountPath: /tmp/octos-data/profiles/cluster-worker.json
          readOnly: true
          subPath: cluster-worker.json
          # The operator-facing LLM profile lives in a read-only ConfigMap
          # mount (over the PVC path) so a UI/API config write cannot be
          # silently shadowed by a stale PVC-resident profile file —
          # config survives rollout without depending on PVC content.
        - name: octos-binary
          mountPath: /opt/octos
          readOnly: true
          # The init-container decodes the binary from ConfigMap
          # `octos-binary` into /opt/octos/octos and chmods +x it.
          # No hostPath required — works on any cluster (docker-desktop,
          # minikube, kind, real K8s).
      volumes:
      - name: octos-data
        persistentVolumeClaim:
          claimName: octos-data
      - name: workspace
        persistentVolumeClaim:
          claimName: workspace
      - name: octos-binary
        emptyDir: {}
      - name: init-script
        configMap:
          name: octos-init-script
          defaultMode: 0o755
      - name: cluster-worker-profile
        configMap:
          name: cluster-worker-profile
          defaultMode: 0o644

---
# Operator-facing LLM profile for the cluster-worker gateway, mounted
# read-only at /tmp/octos-data/profiles/cluster-worker.json (subPath).
# Design (issue #7): profile content is config, not PVC state — a rollout
# restart must NOT lose it (emptyDir would drop it; a stale PVC file would
# shadow ConfigMap LLM vars). The CM mount makes the profile the single
# source of truth while the PVC keeps serving runtime data (sessions, etc).
# The secret value in env_vars below is a PLACEHOLDER — the real key must
# come from the llm-credentials Secret via route.api_key_env resolution;
# keep this CM free of live secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-worker-profile
  namespace: octos
data:
  cluster-worker.json: |
    {
      "id": "cluster-worker",
      "name": "Cluster Worker",
      "enabled": true,
      "data_dir": null,
      "config": {
        "llm": {
          "primary": {
            "family_id": "minimax-token",
            "model_id": "MiniMax-M3",
            "route": {
              "route_id": "minimax-token-plan",
              "base_url": "https://api.minimaxi.com/anthropic",
              "api_key_env": "ANTHROPIC_API_KEY",
              "api_type": "anthropic"
            }
          },
          "fallbacks": []
        },
        "channels": [],
        "gateway": {},
        "email": null,
        "api_type": null,
        "env_vars": {},
        "hooks": [],
        "admin_mode": false,
        "format_after_edit": false,
        "sandbox": {
          "enabled": false,
          "mode": "auto",
          "fail_closed": false,
          "allow_network": false,
          "workspace_write": true,
          "repo_git_write": null,
          "build_cache_slot": null,
          "docker": {"image": "ubuntu:24.04", "cpu_limit": null, "memory_limit": null, "pids_limit": null, "mount_mode": "rw", "extra_binds": []},
          "read_allow_paths": [],
          "write_allow_globs": null,
          "profile_name": null,
          "allow_toolchains": true
        },
        "adaptive_routing": null,
        "content_routing": null,
        "plugins": {"require_signed": false}
      },
      "created_at": "2026-09-17T05:31:46Z",
      "updated_at": "2026-09-17T05:31:46Z"
    }

---
apiVersion: v1
kind: Service
metadata:
  name: octos
  namespace: octos
spec:
  selector:
    app: octos
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP