project:
  name: octos
  description: ""
  methodology: OpenLogos
tech_stack:
  language: Rust（edition 2024，rust 1.85+，deny(unsafe_code)）
  async_runtime: tokio
  tls: rustls（纯 Rust，无 OpenSSL 依赖）
  http_framework: axum
  embedded_storage: redb（EpisodeStore）
  vector_index: hnsw_rs（HybridSearch 向量通道，0.7 向量 + 0.3 BM25）
  llm_abstraction: 自研 LlmProvider trait + registry（4 原生 + N OpenAI 兼容家族 + local 家族；RetryProvider → ProviderChain → AdaptiveRouter 三层 failover）
  sandbox: bwrap / Landlock / sandbox-exec / AppContainer / Docker 五后端（decide_sandbox 纯决策层，fail-closed）
  channels: 17 个 IM 通道适配（teloxide 等各平台 SDK/HTTP，bus 保证行为一致）
  pipeline: 自研 DOT 图引擎（octos-pipeline：checkpoint / parallel fan-out / human gate）
  plugin_protocol: 自包含二进制 + JSON stdin/stdout（语言无关、进程隔离）
  error_handling: eyre / color-eyre
scenario_counter:
  # S01 已由 change chatgpt-oauth-codex 使用(2026-09-18)
  # S02-S15 已由 change baseline-prd 在需求文档中分配(2026-09-18)
  # S16 已由 change k8s-cluster-deploy 使用，S17 已由 change octoloop-night-watchdog 使用(2026-09-20)
  next_id: 18
modules:
  - id: core
    name: 核心功能
    lifecycle: launched
    bootstrap: adopted
    baseline_seed_state: seeded
    skip_phases:
      - api
      - database
      - scenario
    deployment_required: true
deployment_gates:
  core:
    deployment_required: true
    smoke_required: true
    environments:
      - staging
