external_dependencies:
  - name: LLM 提供商 API
    purpose: 全部对话能力
    test_strategy: mock-service（录制/桩 provider）；真实调用测试 #[ignore] 手动触发
  - name: IM 平台（17 通道）
    purpose: 消息收发
    test_strategy: mock-service（通道适配层以假 InboundMessage 单测；端到端手动验证）
  - name: MCP 服务器
    purpose: 工具扩展
    test_strategy: mock-service（内置测试 server fixture）
  - name: 沙箱后端（bwrap/docker 等）
    purpose: 命令隔离
    test_strategy: env-disable + 纯决策层矩阵单测（HostOs × Probe 全组合可跨宿主测试）
  - name: OAuth IdP（OpenAI 等）
    purpose: 登录
    test_strategy: mock-service + fixed-value（本地 callback 仿真）
  - name: embedding provider
    purpose: 记忆向量通道
    test_strategy: env-disable（降级 BM25-only 路径即默认测试路径）
